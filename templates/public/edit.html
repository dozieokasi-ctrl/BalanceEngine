{% extends 'public/base.html' %}{% block title %}Edit task · BalanceEngine{% endblock %}{% block content %}<main class="card narrow"><h1>Edit task</h1><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Task name<input name="name" value="{{ task.name }}" required maxlength="150"></label><div class="two"><label>Hours needed<input name="hours" type="number" min="0.25" max="100" step="0.25" value="{{ task.hours }}" required></label><label>Importance<select name="importance">{% for number in range(1, 6) %}<option value="{{ number }}" {% if task.importance == number %}selected{% endif %}>{{ number }}</option>{% endfor %}</select></label></div><label>Difficulty<select name="difficulty">{% for number in range(1,6) %}<option value="{{ number }}" {% if task.difficulty == number %}selected{% endif %}>{{ number }}</option>{% endfor %}</select></label>
<label>Repeat<select name="repeat" id="repeat"><option value="once" {% if task.repeat == 'once' %}selected{% endif %}>One-time</option><option value="weekly" {% if task.repeat == 'weekly' %}selected{% endif %}>Weekly</option></select></label>
<div id="weekly"><label>Every<select name="weekday">{% for day in ('Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday') %}<option {% if day == task.weekday %}selected{% endif %}>{{ day }}</option>{% endfor %}</select></label><label>Due by<input type="time" name="due_time" value="{{ task.due_time }}"></label></div><label id="once">Deadline ({{ current_user.timezone }})<input name="deadline" type="datetime-local" value="{{ deadline }}" required></label><button class="button">Save changes</button></form><p><a href="{{ url_for('dashboard') }}">Back to tasks</a></p></main><script>const repeat=document.getElementById('repeat');function frequency(){const weekly=repeat.value==='weekly';document.getElementById('weekly').hidden=!weekly;document.getElementById('once').hidden=weekly;document.querySelector('[name=deadline]').required=!weekly;document.querySelector('[name=deadline]').disabled=weekly;}repeat.addEventListener('change',frequency);frequency();</script>{% endblock %}
