{% extends 'public/base.html' %}{% block title %}Edit task · BalanceEngine{% endblock %}{% block content %}<main class="card narrow"><h1>Edit task</h1><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Task name<input name="name" value="{{ task.name }}" required maxlength="150"></label><div class="two"><label>Hours needed<input name="hours" type="number" min="0.25" max="100" step="0.25" value="{{ task.hours }}" required></label><label>Importance<select name="importance">{% for number in range(1, 6) %}<option value="{{ number }}" {% if task.importance == number %}selected{% endif %}>{{ number }}</option>{% endfor %}</select></label></div><label>Deadline ({{ current_user.timezone }})<input name="deadline" type="datetime-local" value="{{ deadline }}" required></label><button class="button">Save changes</button></form><p><a href="{{ url_for('dashboard') }}">Back to tasks</a></p></main>{% endblock %}
